name: Production Migration Ledger Certification

on:
  workflow_dispatch:
    inputs:
      production_versions:
        description: 'Comma or whitespace separated 14-digit versions from a fresh read-only production migration ledger listing'
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      PRODUCTION_MIGRATION_VERSIONS: ${{ inputs.production_versions }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          printf 'verified_source_sha=%s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Verify ledger parser and fail-closed drift semantics
        run: node --test tests/migration-ledger.test.mjs

      - name: Compare repository migrations with production ledger evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          node scripts/verify-migration-ledger.mjs \
            --receipt ci-evidence/migration-ledger-receipt.json
          sha256sum ci-evidence/migration-ledger-receipt.json \
            > ci-evidence/migration-ledger-receipt.sha256
          cat ci-evidence/migration-ledger-receipt.json
          {
            printf 'migration_ledger_receipt_sha256='
            awk '{print $1}' ci-evidence/migration-ledger-receipt.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain migration ledger certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-migration-ledger-${{ env.EXPECTED_SOURCE_SHA }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 30
