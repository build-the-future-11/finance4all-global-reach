name: One-shot production lockfile remediation

on:
  push:
    branches:
      - ci/production-dependency-audit-20260901
    paths:
      - .github/workflows/one-shot-lockfile-remediation.yml

permissions:
  contents: write

jobs:
  remediate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/production-dependency-audit-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate bounded lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          cp package-lock.json /tmp/package-lock.before
          npm audit fix --package-lock-only --omit=dev
          cmp -s package.json /tmp/package.json.before
          npm audit --omit=dev --audit-level=high
          if cmp -s package-lock.json /tmp/package-lock.before; then
            echo "No lockfile change required."
            exit 0
          fi
      - name: Commit only the reviewed lockfile class of change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit."
            exit 0
          fi
          if ! git diff --quiet -- . ':!package-lock.json'; then
            echo "Unexpected non-lockfile change detected; refusing to commit."
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply bounded production lockfile remediation"
          git push origin HEAD:ci/production-dependency-audit-20260901
