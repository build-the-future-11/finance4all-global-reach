name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci.example.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-key-for-build-contract-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Repository lint baseline
        continue-on-error: true
        run: npm run lint
