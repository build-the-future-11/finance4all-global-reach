name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci.example.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-key-for-build-contract-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit-prod.json
          status=$?
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-prod.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const vulnerable = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => ['high', 'critical'].includes(value.severity))
            .map(([name, value]) => `${name}: ${value.severity} (${value.isDirect ? 'direct' : 'transitive'})`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Production dependency audit\n\nCounts: \`${JSON.stringify(counts)}\`\n\nHigh/critical packages:\n${vulnerable.length ? vulnerable.map((x) => `- ${x}`).join('\n') : '- none'}\n`,
          );
          NODE
          exit "$status"
      - name: Upload production dependency audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-dependency-audit
          path: npm-audit-prod.json
          retention-days: 14
      - name: Generate candidate safe lockfile remediation
        if: failure()
        shell: bash
        run: |
          cp package-lock.json package-lock.before-remediation.json
          npm audit fix --package-lock-only --omit=dev || true
          npm audit --omit=dev --json > npm-audit-candidate.json || true
          if cmp -s package-lock.before-remediation.json package-lock.json; then
            echo "candidate_changed=false" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "candidate_changed=true" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate lockfile remediation evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-dependency-remediation-candidate
          path: |
            package-lock.json
            npm-audit-candidate.json
          retention-days: 7
      - name: TypeScript compilation gate
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Repository lint gate
        run: npm run lint
