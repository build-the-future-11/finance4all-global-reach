name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authorization contract
        run: npm run test -- authorization-contract
      - name: Production build
        run: npm run build
      - name: Repository lint baseline
        continue-on-error: true
        run: npm run lint
