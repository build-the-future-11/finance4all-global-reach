name: Finish FinanceMeta brand sweep

on:
  push:
    branches: ["cursor/membership-security-supabase-fix"]

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/membership-security-supabase-fix
      - name: Replace legacy shipped brand strings
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('src'), Path('public')]
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if 'Finance4All' not in text:
                      continue
                  path.write_text(text.replace('Finance4All', 'FinanceMeta'))
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Verify no legacy shipped brand remains
        run: |
          if grep -R -n --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' 'Finance4All' src public; then
            echo 'Legacy shipped brand remains'
            exit 1
          fi
      - name: Commit sweep
        run: |
          if git diff --quiet -- src public; then
            echo 'No brand changes needed'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public
          git commit -m "Complete FinanceMeta shipped brand sweep [skip ci]"
          git push origin HEAD:cursor/membership-security-supabase-fix
