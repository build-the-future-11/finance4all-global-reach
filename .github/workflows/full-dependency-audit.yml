name: Full Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/full-dependency-audit.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/full-dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install locked dependency tree
        run: npm ci --no-audit --fund=false

      - name: Audit full dependency tree for High/Critical advisories
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-evidence
          npm audit --audit-level=high --json | tee audit-evidence/npm-audit-full.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: finance4all-full-dependency-audit-${{ github.sha }}
          path: audit-evidence/npm-audit-full.json
          if-no-files-found: error
          retention-days: 14
