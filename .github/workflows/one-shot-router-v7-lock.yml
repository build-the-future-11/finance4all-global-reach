name: One-shot Router v7 lockfile

on:
  push:
    branches:
      - deps/react-router-v7-20260901
    paths:
      - package.json
      - .github/workflows/one-shot-router-v7-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: deps/react-router-v7-20260901
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from committed package manifest
        run: |
          set -euo pipefail
          cp package.json /tmp/package.before.json
          npm install --package-lock-only --ignore-scripts
          cmp -s package.json /tmp/package.before.json
          npm audit --omit=dev --audit-level=high
          git diff --exit-code -- package.json
          git diff -- package-lock.json
      - name: Commit lockfile only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change required.'
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'package-lock.json'
          git commit -m 'deps(router): regenerate v7 lockfile'
          git push origin HEAD:deps/react-router-v7-20260901
